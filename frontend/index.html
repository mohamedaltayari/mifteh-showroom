<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منظومة العالمية — حمودة</title>
<meta name="theme-color" content="#1C7EA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login-screen no-print" id="loginScreen">
 <div class="login-layout">
  <div class="login-hero">
    <div class="login-eyebrow">HAMOUDA · OPERATIONS &amp; SHIPPING</div>
    <h1 class="login-headline" id="heroHeadline"></h1>
    <p class="login-lede" id="heroLede"></p>
    <div class="hero-scene" id="heroScene"></div>
    <div class="hero-stats" id="heroStats"></div>
  </div>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-top-bar">
      <div class="lang-menu" id="langSwitchLogin"></div>
      <button type="button" class="theme-toggle on-light" id="themeToggleLogin"></button>
    </div>
    <div class="cargo-stripe"></div>
    <div class="login-top">
      <span class="login-badge" id="loginBadge"></span>
      <div class="login-brand" id="loginBrand"></div>
      <div class="login-tagline">AFIC · OPERATIONS &amp; SHIPPING</div>
    </div>
    <p class="login-sub" id="loginSub"></p>
    <div class="demo-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <span id="loginDemoNotice"></span>
    </div>
    <label class="login-field">
      <span id="loginQuickSelectLabel"></span>
      <select id="loginQuickSelect"></select>
      <span class="muted" style="font-size:.7rem;" id="loginQuickSelectHint"></span>
    </label>
    <div class="login-divider" id="loginDividerText"></div>
    <label class="login-field">
      <span id="loginUsernameLabel"></span>
      <input type="text" id="loginUsername" autocomplete="username" required>
    </label>
    <label class="login-field">
      <span id="loginPasswordLabel"></span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <div class="login-error" id="loginError" hidden></div>
    <button type="submit" class="login-btn" id="loginBtnText"></button>
  </form>
 </div>
</div>
<div class="app no-print" id="app-shell">
  <div class="demo-bar" id="demoBar" hidden></div>
  <header class="topbar">
    <div class="topbar-left" id="topbarLeft">
      <div class="lang-menu" id="langSwitch"></div>
      <span class="topbar-divider"></span>
      <div class="user-chip-mini">
        <span class="avatar-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg></span>
        <div class="user-text">
          <span class="u-role" id="currentUserRole"></span>
          <span class="u-email" id="currentUserEmail"></span>
        </div>
      </div>
      <button type="button" class="notif-toggle-btn" id="notifToggleBtn"></button>
      <button type="button" class="theme-toggle" id="themeToggle"></button>
      <button type="button" class="logout-icon-btn" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></button>
    </div>
  </header>
  <nav class="rail">
    <div class="brand-row">
      <span class="brand-badge" id="brandBadge"></span>
      <div>
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="rail-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span id="autosaveLabel"></span>
    </div>
    <div class="rail-credit" id="railCredit"></div>
  </nav>
  <main id="mainArea"></main>
</div>
<div id="printArea" style="display:none;"></div>
<div class="toast-wrap no-print" id="toastWrap" role="status" aria-live="polite"></div>
<div id="modalHost" class="no-print"></div>
<div id="assistantHost" class="no-print"></div>

<script src="server.js"></script>
<script src="app.js"></script>
</body>
</html>
